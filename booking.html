<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>線上預約｜玹翔旅遊</title>

<meta name="description" content="玹翔旅遊機場接送、港口接送、旅遊包車、登山包車、演唱會接送線上預約系統">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--gold2:#f7d774;
--bg:#070707;
--card:#111;
--border:rgba(212,175,55,.25);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans TC',sans-serif;
}

body{
background:#000;
color:#fff;
}

.hero{
padding:80px 20px;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.8)),
url('images/booking-hero.jpg') center/cover;
}

.hero h1{
font-size:48px;
font-weight:900;
color:var(--gold2);
}

.hero p{
margin-top:15px;
font-size:18px;
opacity:.9;
}

.container{
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:30px;
margin-bottom:25px;
}

.card h2{
color:var(--gold2);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:700;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #333;
background:#181818;
color:#fff;
}

textarea{
min-height:120px;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,var(--gold),var(--gold2));
font-size:18px;
font-weight:900;
cursor:pointer;
}

.price-box{
background:#0f0f0f;
border:2px solid var(--gold);
padding:25px;
border-radius:20px;
text-align:center;
}

.price{
font-size:42px;
font-weight:900;
color:var(--gold2);
}

.hidden{
display:none;
}

@media(max-width:768px){

.grid,
.grid3{
grid-template-columns:1fr;
}

.hero h1{
font-size:34px;
}

}

</style>
</head>

<body>

<section class="hero">
<h1>線上預約系統</h1>
<p>機場接送｜港口接送｜旅遊包車｜登山包車｜演唱會接送</p>
</section>

<div class="container">

<form id="bookingForm">

<div class="card">
<h2>基本資料</h2>

<div class="grid">

<div>
<label>服務項目 *</label>
<select id="service">
<option value="">請選擇</option>
<option>機場接送</option>
<option>港口接送</option>
<option>旅遊包車</option>
<option>登山包車</option>
<option>演唱會接送</option>
</select>
</div>

<div>
<label>服務細項 *</label>
<select id="serviceDetail"></select>
</div>

<div>
<label>貴賓姓名 *</label>
<input type="text">
</div>

<div>
<label>手機 *</label>
<input type="tel">
</div>

<div>
<label>預約日期 *</label>
<input type="date">
</div>

<div>
<label>上車時間 / 落地時間 *</label>
<input type="time">
</div>

</div>
</div>

<div class="card">
<h2>行程資訊</h2>

<div class="grid">

<div>
<label>上車地點 *</label>
<input id="pickup">
</div>

<div>
<label>下車地點 *</label>
<input id="dropoff">
</div>

<div>
<label>航班編號</label>
<input>
</div>

<div>
<label>船班梯次</label>
<input>
</div>

</div>

</div>

<div class="card">

<h2>乘車資訊</h2>

<div class="grid">

<div>
<label>人數 *</label>
<input id="people" type="number" min="1" max="20">
</div>

<div>
<label>行李數 *</label>
<input id="bags" type="number" min="0" max="20">
</div>

</div>

</div>

<div class="card">
<h2>車型選擇</h2>

<select id="carType">

<option>舒適五人座</option>
<option>豪華九人座</option>
<option>VITO</option>
<option>阿法</option>
<option>Lexus LM</option>
<option>明星保母車</option>
<option>依客服派車</option>

</select>

</div>

<div class="card">
<h2>備註</h2>
<textarea></textarea>
</div>

<div class="price-box">

<div>預估金額</div>

<div class="price" id="price">
$0
</div>

</div>

<br>

<button class="btn" type="submit">
立即送出預約
</button>

</form>

</div>

<script>

const serviceMap={

"機場接送":["送機","接機","來回接送"],

"港口接送":["送港","接船","來回接送"],

"旅遊包車":[
"一日遊",
"兩天一夜",
"三天兩夜",
"四天三夜",
"五天四夜"
],

"登山包車":[
"去程",
"回程",
"一日縱走",
"兩天一夜",
"三天兩夜"
],

"演唱會接送":[
"去程",
"回程",
"來回",
"包車"
]

};

const service=document.getElementById("service");
const detail=document.getElementById("serviceDetail");

service.addEventListener("change",()=>{

detail.innerHTML="";

(serviceMap[service.value]||[])
.forEach(item=>{

detail.innerHTML+=`
<option>${item}</option>
`;

});

});

</script>

</body>
</html>
