:root{

#bookingForm.card{

.booking-tools{

.dynamic-block{

.dynamic-head{display:flex;align-items:center;justify-content:space-between;gap:12px}

.dynamic-list{display:grid;gap:10px}
.dynamic-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.mini-btn{

.conditional-field.is-hidden,.tax-fields.is-hidden{display:none!important}
.addon-box.addon-upgrade{

.addon-box legend{padding:0 10px;font-size:20px;color:var(--booking-gold-2)}
.addon-row{

  align-items:center;
  padding:14px 0;

  if(!form) return;
  const AIRPORT_SHEETS = ["桃園機場","松山機場","清泉岡機場","小港機場"];
  const PORT_SHEETS = ["平安港","台北郵輪港","台中港","高雄香蕉碼頭","基隆港","東港碼頭","布袋港碼頭","富岡漁港","後壁湖碼頭"];
  const ADDON_PRICES = {
    forwardSeat:200,
    rearSeat:200,
    booster:200,
    sign:200,
    luggage12:100,
    luggage3:200,
    pet:200
  };
  const BUSINESS_CARS = [

    "VITO-2",

  const VEHICLE_RULES = {

    noFiveSeat: ["van9", "vito", "lm", "alphard", "sprinter"],

  const priceCache = new Map();

  const $$ = (s, root=form) => Array.from(root.querySelectorAll(s));
  const money = n => Number.isFinite(Number(n))
    ? "NT$" + Math.round(Number(n)).toLocaleString("zh-TW")
    : "待客服確認";
  const text = el => String(el?.value || "").trim();
  const normalize = v => String(v || "")
    .replace(/\s+/g,"")
    .replace(/臺/g,"台")
    .toLowerCase();
  const parseMoney = v => {
    const n = Number(String(v || "").replace(/[^0-9]/g,""));
    return Number.isFinite(n) && n > 0 ? n : 0;
  };

  function parsePeopleCount(){
    const value = text($('[name="passengers"]'));
    const numbers = value.match(/\d+/g) || [];
    if(!numbers.length) return 0;
    return numbers.map(Number).reduce((sum, n)=>sum + n, 0);
  }

  function parseLargeLuggageCount(){
    const value = text($('[name="luggage"]'));
    const matches = Array.from(value.matchAll(/(\d+)\s*(?:件|咖|個)?\s*(?:29|２９|28|２８)\s*(?:吋|寸)?/g));

    if(matches.length){
      return matches.reduce((sum, match)=>sum + Number(match[1] || 0), 0);
    }

    const allNumbers = value.match(/\d+/g) || [];
    return allNumbers.length ? Number(allNumbers[0]) : 0;
  }

  function getAllowedVehicleKinds(){
  const people = parsePeopleCount();
  const largeLuggage = parseLargeLuggageCount();

  if(people >= 7 && people <= 8 && largeLuggage > 8){
    return {
      allowed: VEHICLE_RULES.sprinterOnly,
      reason: "7～8人且 28／29 吋大型行李超過 8 件，只可選明星保母車。"
    };
  }

  if(people >= 7 || largeLuggage > 7){
    return {
      allowed: VEHICLE_RULES.sevenPlus,
      reason: "7人以上或 28／29 吋大型行李超過 7 件，只可選豪華九人座、VITO 或明星保母車。"
    };
  }

  if(people >= 4 || largeLuggage > 3){
    return {
      allowed: VEHICLE_RULES.noFiveSeat,
      reason: "4人以上或 28／29 吋大型行李超過 3 件，不可選舒適五人座、進口車或 S-Class。"
    };
  }

  return {
    allowed: VEHICLE_RULES.smallGroup,
    reason: "1～3人且 28／29 吋大型行李 3 件內，可選全部車型。"
  };
}

  function updateVehicleAvailability(){
    const select = $('#vehicleSelect');
    if(!select) return;

    const { allowed, reason } = getAllowedVehicleKinds();
    const options = Array.from(select.options);

    options.forEach(option=>{
      const kind = option.dataset.vehicleKind;
      const canUse = allowed.includes(kind);
      option.disabled = !canUse;
      option.textContent = option.value + (canUse ? "" : "（不適用）");
    });

    if(select.selectedOptions[0]?.disabled){
      const firstAllowed = options.find(option=>!option.disabled);
      if(firstAllowed) select.value = firstAllowed.value;
    }

    const suggest = $('#vehicleSuggest');
    if(suggest){
      suggest.textContent = reason;
    }
  }
  function escapeAttr(value){
    return String(value || "").replace(/"/g,"&quot;");
  }
  function makeDynamicRow(group, value=""){
    const name = group.dataset.targetName;
    const placeholder = group.dataset.placeholder || "";
    const row = document.createElement("div");
    row.className = "dynamic-row";
    row.innerHTML = `
      <input class="input" name="${name}[]" value="${escapeAttr(value)}" placeholder="${placeholder}">
      <button class="mini-btn danger" type="button" data-remove-dynamic>刪除</button>
    `;
    row.querySelector("[data-remove-dynamic]").addEventListener("click",()=>{
      const list = group.querySelector("[data-dynamic-list]");
      if(list.querySelectorAll(".dynamic-row").length > 1){
        row.remove();
      }
      syncPrimaryFields();
      updateEstimate();
    });
    row.querySelector("input").addEventListener("input",()=>{
      syncPrimaryFields();
      updateEstimate();
    });
    return row;
  }
  function initDynamic(){
    $$("[data-dynamic-group]").forEach(group=>{
      const list = group.querySelector("[data-dynamic-list]");
      const btn = group.querySelector("[data-add-dynamic]");
      if(!list.children.length){
        list.appendChild(makeDynamicRow(group));
      }
      btn?.addEventListener("click",()=>{
        list.appendChild(makeDynamicRow(group));
      });
    });
  }
  function collectArray(name){
    return $$(`[name="${name}[]"]`)
      .map(input=>input.value.trim())
      .filter(Boolean);
  }
  function syncPrimaryFields(){
    const names = collectArray("passengerNames");
    const contacts = collectArray("contacts");
    const pickups = collectArray("pickups");
    const dropoffs = collectArray("dropoffs");
    $('[name="name"]').value = names.join("、");
    $('[name="phone"]').value = contacts[0] || "";
    $('[name="contactApp"]').value = contacts.join("、");
    $('[name="pickup"]').value = pickups.join("、");
    $('[name="dropoff"]').value = dropoffs.join("、");
  }
  function isService(type){
    const serviceText = [
      text($('[name="service"]')),
      text($('[name="serviceDetail"]'))
    ].join(" ");
    const v = normalize(serviceText);
    if(type === "tour"){
      return v.includes("旅遊") || v.includes("登山") || v.includes("百岳") || v.includes("包車行程");
    }
    if(type === "airport"){
      return v.includes("機場") || AIRPORT_SHEETS.some(name=>v.includes(normalize(name)));
    }
    if(type === "port"){
      return v.includes("港口") || v.includes("郵輪") || v.includes("碼頭") || v.includes("船") || PORT_SHEETS.some(name=>v.includes(normalize(name)));
    }
    if(type === "roundtrip"){
      return v.includes("來回");
    }
    if(type === "concert"){
      return v.includes("演唱會") || v.includes("音樂祭") || v.includes("音樂節") || v.includes("活動接送") || v.includes("s2o");
    }
    return false;
  }
  function updateConditional(){
    $$("[data-show-when]").forEach(field=>{
      const show = isService(field.dataset.showWhen);
      field.classList.toggle("is-hidden", !show);
      $$("input,select,textarea", field).forEach(input=>{
        input.disabled = !show;
        if(!show) input.value = "";
      });
    });
    const taxCheck = $('[data-addon-check="taxId"]');
    const taxFields = $("[data-tax-fields]");
    taxFields?.classList.toggle("is-hidden", !taxCheck?.checked);

    // 顯示規則：所有服務保留日期、時間、上下車地址；只有旅遊／登山包車顯示行程規劃。
    const pickupBlocks = document.querySelectorAll('[data-dynamic-group="pickups"]');
    const dropoffBlocks = document.querySelectorAll('[data-dynamic-group="dropoffs"]');
    pickupBlocks.forEach(el=>el.classList.remove('is-hidden'));
    dropoffBlocks.forEach(el=>el.classList.remove('is-hidden'));

    const midpointsField = document.querySelector('[name="midpoints"]')?.closest('label');
    if(midpointsField){
      midpointsField.classList.toggle('is-hidden', !isService('tour'));
    }
  }
  function clampQty(input){
    let n = parseInt(input.value || "0", 10);
    if(!Number.isFinite(n)) n = 0;
    n = Math.max(0, Math.min(9, n));
    input.value = String(n);
    const key = input.dataset.addonQty;
    const check = $(`[data-addon-check="${key}"]`);
    if(check) check.checked = n > 0;
  }
  function addonSummary(){
    const items = [];
    let total = 0;
    Object.keys(ADDON_PRICES).forEach(key=>{
      const check = $(`[data-addon-check="${key}"]`);
      const qtyInput = $(`[data-addon-qty="${key}"]`);
      const qty = Math.max(0, Math.min(9, Number(qtyInput?.value || 0)));
      if(check?.checked && qty > 0){
        const amount = ADDON_PRICES[key] * qty;
        total += amount;
        items.push(`${check.value} x${qty}（${money(amount)}）`);
      }
    });
    ["receipt","taxId","creditCard"].forEach(key=>{
      const check = $(`[data-addon-check="${key}"]`);
      if(check?.checked) items.push(check.value);
    });
    return { total, items };
  }
  function findSheetName(){
    const haystack = normalize([
      text($('[name="service"]')),
      text($('[name="serviceDetail"]')),
      collectArray("pickups").join(" "),
      collectArray("dropoffs").join(" ")
    ].join(" "));
    const list = isService("port") ? PORT_SHEETS : AIRPORT_SHEETS;
    return list.find(name=>haystack.includes(normalize(name))) ||
      (isService("airport") ? "桃園機場" : "");
  }
  async function fetchPrice(sheetName){
    if(!sheetName || !window.XXPricing?.fetchSheet) return null;
    if(priceCache.has(sheetName)) return priceCache.get(sheetName);
    const data = await window.XXPricing.fetchSheet(sheetName);
    priceCache.set(sheetName, data);
    return data;
  }
  function vehicleIndex(headers){
    const vehicle = normalize(text($("#vehicleSelect")));
    const fallback =
      vehicle.includes("五人") || vehicle.includes("豪華") ? 2 :
      vehicle.includes("vito") ? 4 :
      vehicle.includes("alphard") || vehicle.includes("阿法") ? 5 :
      vehicle.includes("明星") ? 6 :
      vehicle.includes("商務") || vehicle.includes("lm") || vehicle.includes("九人") ? 3 :
      -1;
    if(!headers?.length) return fallback;
    const idx = headers.findIndex(header=>{
      const h = normalize(header);
      return h && (h.includes(vehicle) || vehicle.includes(h));
    });
    return idx >= 2 ? idx : fallback;
  }
  function addressForPrice(){
    const pickups = collectArray("pickups").join(" ");
    const dropoffs = collectArray("dropoffs").join(" ");
    const sheetName = findSheetName();
    const sheetNorm = normalize(sheetName);
    return normalize(pickups).includes(sheetNorm)
      ? dropoffs
      : pickups || dropoffs;
  }
  async function getBaseFare(){
    const sheetName = findSheetName();
    if(!sheetName || isService("tour")){
      return 0;
    }
    const data = await fetchPrice(sheetName);
    if(!data?.rows?.length){
      return 0;
    }
    const headers = data.headers || [];
    const idx = vehicleIndex(headers);
    if(idx < 2){
      return 0;
    }
    const addr = addressForPrice();
    const row =
      data.rows.find(r=>addr.includes(normalize(r[0])) && addr.includes(normalize(r[1]))) ||
      data.rows.find(r=>addr.includes(normalize(r[1]))) ||
      null;
    return row ? parseMoney(row[idx]) : 0;
  }
  async function updateEstimate(){
    syncPrimaryFields();
    updateConditional();
    updateVehicleAvailability();
    $$("[data-addon-qty]").forEach(clampQty);
    const petChecked = $('[data-addon-check="pet"]')?.checked;
    const vehicle = text($("#vehicleSelect"));
    if(petChecked && !BUSINESS_CARS.some(car=>vehicle.includes(car))){
      $("#vehicleSuggest").textContent = "提醒：寵物接送只可選商務車型，請改選豪華九人座、VITO、LM、Alphard 或明星保母車。";
      const petCheck = $('[data-addon-check="pet"]');
      const petQty = $('[data-addon-qty="pet"]');
      if(petCheck) petCheck.checked = false;
      if(petQty) petQty.value = "0";
    }
    const baseFare = await getBaseFare();
    const addons = addonSummary();
    const subtotal = baseFare + addons.total;
    const creditCard = $('[data-addon-check="creditCard"]')?.checked || text($('[name="paymentMethod"]')).includes("刷");
    const cardFee = creditCard && subtotal > 0 ? Math.round(subtotal * 0.06) : 0;
    const total = subtotal + cardFee;
    $("#baseFareText").textContent = baseFare ? money(baseFare) : "待客服確認";
    $("#addonTotalText").textContent = money(addons.total);
    $("#cardFeeText").textContent = money(cardFee);
    $("#estimatedTotalText").textContent = total ? money(total) : "待客服確認";
    $('[name="baseFare"]').value = baseFare || "";
    $('[name="addonTotal"]').value = addons.total || 0;
    $('[name="cardFee"]').value = cardFee || 0;
    $('[name="estimatedTotal"]').value = total || "";
    $('[name="customerAddons"]').value = addons.items.join("、");
  }
  function setBookingResult(message, type="warn"){
    const box = document.getElementById("bookingResult");
    if(!box) return;
    const bg = type === "ok" ? "rgba(60,180,120,.14)" : "rgba(216,181,109,.12)";
    const border = type === "ok" ? "rgba(90,220,150,.35)" : "rgba(216,181,109,.32)";
    box.innerHTML = `<div style="padding:14px 16px;border:1px solid ${border};border-radius:16px;background:${bg};color:#fff0b8;font-weight:950;line-height:1.8">${message}</div>`;
  }

  function validateBookingBeforeSubmit(){
    syncPrimaryFields();
    updateVehicleAvailability();
    const errors = [];
    const passengerNames = collectArray("passengerNames");
    const contacts = collectArray("contacts");
    const pickups = collectArray("pickups");
    const dropoffs = collectArray("dropoffs");
    const service = text($('[name="service"]'));
    const date = text($('[name="date"]'));
    const time = text($('[name="time"]'));
    const passengers = text($('[name="passengers"]'));
    const luggage = text($('[name="luggage"]'));
    const vehicle = text($("#vehicleSelect"));
    const agreeTerms = $('[name="agreeTerms"]')?.checked;
    const agreePrivacy = $('[name="agreePrivacy"]')?.checked;
    const petChecked = $('[data-addon-check="pet"]')?.checked;
    const taxChecked = $('[data-addon-check="taxId"]')?.checked;

    if(!service) errors.push("請選擇服務項目。");
    if(!passengerNames.length) errors.push("請至少填寫一位乘客姓名。");
    if(!contacts.length) errors.push("請至少填寫一組聯絡方式，電話或 LINE 都可以，但不要讓客服通靈。");
    if(!date) errors.push("請填寫用車日期。");
    if(!time) errors.push("請填寫用車時間。");
    if(!pickups.length) errors.push("請至少填寫一個上車地點。");
    if(!dropoffs.length) errors.push("請至少填寫一個下車地點。");
    if(!passengers) errors.push("請填寫人數，例：2位大人＋1位小孩。");
    if(!luggage) errors.push("請填寫行李數量，沒有行李也可填：無。");
    if(isService("airport") && !text($('[name="flight"]'))) errors.push("機場接送請填航班編號，例：CI123、BR456。");
    if(isService("port") && !text($('[name="shipSession"]'))) errors.push("港口接送請填船班梯次或船班時間。");
    if(isService("tour") && !text($('[name="midpoints"]'))) {
      errors.push("旅遊包車／登山包車請填寫行程規劃。");
    }
    if(isService("tour") && !text($('[name="days"]'))) errors.push("旅遊包車／登山包車請填寫包車天數。");
    if(isService("tour") && !text($('[name="hours"]'))) errors.push("旅遊包車／登山包車請填寫用車時數。");
    if(isService("concert") && !text($('[name="eventName"]'))) errors.push("演唱會接送請填寫活動名稱。");
    if(isService("port") && !text($('[name="portFlight"]'))) errors.push("港口接送請填寫航班編號；若無航班請填無。");
    if(petChecked && !BUSINESS_CARS.some(car=>vehicle.includes(car))) errors.push("寵物接送只可選商務車型，請改選豪華九人座、VITO、LM、Alphard 或明星保母車。");
    if(taxChecked && (!text($('[name="taxIdNumber"]')) || !text($('[name="taxTitle"]')))) errors.push("已勾選開立統編，請填寫統一編號與公司抬頭。");
    if(!agreeTerms) errors.push("請勾選同意條款政策與訂金／取消規範。");
    if(!agreePrivacy) errors.push("請勾選同意隱私權政策。");

    if(errors.length){
      setBookingResult("請先補齊以下資料：<br>・" + errors.join("<br>・"));
      const firstInvalid = form.querySelector(":invalid") || document.getElementById("bookingResult");
      firstInvalid?.scrollIntoView({ behavior:"smooth", block:"center" });
      return false;
    }
    return true;
  }

  const oldSubmit=window.submitBooking;
  window.submitBooking=function(event){
    if(!validateBookingBeforeSubmit()){
      event.preventDefault();
      return false;
    }
    syncPrimaryFields();
    const addons=addonSummary();
    $('[name="customerAddons"]').value=addons.items.join("、");
    setBookingResult("資料檢查完成，正在送出預約需求，請勿重複點擊。", "ok");
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn){
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";
      setTimeout(()=>{ submitBtn.disabled = false; submitBtn.textContent = "送出預約"; }, 9000);
    }
    if(window.XXAnalytics&&typeof window.XXAnalytics.trackEvent==="function"){
      window.XXAnalytics.trackEvent("booking_submit_click",{
        service:text($('[name="service"]')),
        vehicle:text($("#vehicleSelect")),
        estimated_total:$('[name="estimatedTotal"]').value||"not_estimated"
      });
    }
    if(typeof oldSubmit==="function") return oldSubmit(event);
  };
  window.suggestVehicle = updateVehicleAvailability;

  document.addEventListener("DOMContentLoaded",()=>{
    initDynamic();
    updateConditional();
    updateVehicleAvailability();
    updateEstimate();
    form.addEventListener("input",()=>updateEstimate());
    form.addEventListener("change",()=>updateEstimate());
    form.querySelectorAll('a[target="_blank"]').forEach(link=>{
      link.setAttribute("rel", "noopener noreferrer");
    });
  });
})();
</script>
