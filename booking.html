<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>線上預約｜玹翔旅遊</title>

<meta name="description" content="玹翔旅遊機場接送、港口接送、旅遊包車、登山包車、演唱會接送線上預約系統">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--gold2:#f7d774;
--bg:#070707;
--card:#111;
--border:rgba(212,175,55,.25);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans TC',sans-serif;
}

body{
background:#000;
color:#fff;
}

.hero{
padding:80px 20px;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.8)),
url('images/booking-hero.jpg') center/cover;
}

.hero h1{
font-size:48px;
font-weight:900;
color:var(--gold2);
}

.hero p{
margin-top:15px;
font-size:18px;
opacity:.9;
}

.container{
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:30px;
margin-bottom:25px;
}

.card h2{
color:var(--gold2);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:700;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #333;
background:#181818;
color:#fff;
}

textarea{
min-height:120px;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,var(--gold),var(--gold2));
font-size:18px;
font-weight:900;
cursor:pointer;
}

.price-box{
background:#0f0f0f;
border:2px solid var(--gold);
padding:25px;
border-radius:20px;
text-align:center;
}

.price{
font-size:42px;
font-weight:900;
color:var(--gold2);
}

.hidden{
display:none;
}

@media(max-width:768px){

.grid,
.grid3{
grid-template-columns:1fr;
}

.hero h1{
font-size:34px;
}

}

</style>
</head>

<body>

<section class="hero">
<h1>線上預約系統</h1>
<p>機場接送｜港口接送｜旅遊包車｜登山包車｜演唱會接送</p>

<form id="bookingForm">

<div>

<input id="dropoff" name="dropoff" class="google-place" required>
</div>

<input name="flightNo">\n</div>\n\n<div>\n<label>船班梯次</label>
<input name="shipNo">\n</div>\n\n</div>\n\n<div id="routeDays"></div>\n<div id="midpointBox"></div>\n\n</div>\n\n<div class="card">\n\n<h2>乘車資訊</h2>

<div class="grid">

<div>
<label>人數 *</label>
<input id="people" name="people" type="number" min="1" max="20" required>
</div>

<div>
<label>行李數 *</label>

</div>


<div class="card">
<h2>加購項目</h2>
<div class="grid3">
<div><label>正向安全座椅 +200/張</label><select class="addon" data-price="200" name="forwardSeat"></select></div>
<div><label>反向安全座椅 +200/張</label><select class="addon" data-price="200" name="rearSeat"></select></div>
<div><label>增高墊 +200/張</label><select class="addon" data-price="200" name="booster"></select></div>
<div><label>舉牌服務 +200/次</label><select class="addon" data-price="200" name="signBoard"></select></div>
<div><label>行李搬運2樓以下 +100/趟</label><select class="addon" data-price="100" name="luggage2F"></select></div>
<div><label>行李搬運3樓以上 +200/趟</label><select class="addon" data-price="200" name="luggage3F"></select></div>
<div><label>寵物接送 +100/隻</label><select class="addon" data-price="100" name="pet"></select></div>

</div>

<br>

<label>
<input type="checkbox" id="taxCheck" name="needTaxId">
開立統編

<label>

<div class="grid3">
<div><label>正向安全座椅 +200/張</label><select class="addon" data-price="200" name="forwardSeat"></select></div>
<div><label>反向安全座椅 +200/張</label><select class="addon" data-price="200" name="rearSeat"></select></div>

開立統編

<div>
<label>公司抬頭</label>
<input name="companyTitle">
</div>
<div>

<input name="taxId" maxlength="8">
</div>

<input type="checkbox" id="cardCheck" name="needCard">
需刷卡
</label>

<div class="card">
<h2>車型選擇</h2>

<select id="carType" name="vehicle">
<option value="">請選擇車型</option>
<option>舒適五人座</option>
<option>豪華9人座</option>
<option>VITO</option>
<option>阿法</option>

</select>

<script>
const CONFIG = window.XUANXIANG_CONFIG || {};
const API = CONFIG.APPS_SCRIPT_URL || CONFIG.BOOKING_API || "";

const serviceMap = {
  "機場接送":["送機","接機","接送"],
  "港口接送":["送港","接船","接送"],
  "旅遊包車":["一日遊","兩天一夜","三天兩夜","四天三夜","五天四夜"],
  "登山包車":["去程","回程","一日縱走","兩天一夜","三天兩夜"],
  "演唱會接送":["去程","回程","來回","包車"]
};

const airportSheets = ["桃園機場","松山機場","清泉岡機場","小港機場"];
const portSheets = ["平安港","台北郵輪港","台中港","高雄香蕉碼頭","基隆港","東港碼頭","布袋港碼頭","富岡漁港","後壁湖碼頭"];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const money = n => n ? "NT$" + Number(n).toLocaleString("zh-TW") : "$0";

function fillQty(){
  $$(".addon").forEach(sel=>{
    sel.innerHTML = Array.from({length:10},(_,i)=>`<option value="${i}">${i}</option>`).join("");
  });
}

function addMidpoint(value=""){
  const box = $("#midpointBox");
  box.insertAdjacentHTML("beforeend",`
    <div class="grid midpoint-row">
      <div>
        <label>中途點</label>
        <input class="google-place midpoint" name="midpoints[]" value="${value}" placeholder="可輸入景點、飯店、地址">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" type="button" onclick="this.closest('.midpoint-row').remove();calc();">刪除中途點</button>
      </div>
    </div>
  `);
  initPlaces();
}

function renderDays(){
  const service = $("#service").value;
  const detail = $("#serviceDetail").value;
  const box = $("#routeDays");
  box.innerHTML = "";

  const dayMap = {"一日遊":1,"一日縱走":1,"兩天一夜":2,"三天兩夜":3,"四天三夜":4,"五天四夜":5};

  if(service !== "旅遊包車" && service !== "登山包車"){
    $("#midpointBox").innerHTML = `
      <br>
      <button class="btn" type="button" onclick="addMidpoint()">＋新增中途點</button>
    `;
    return;
  }

  const days = dayMap[detail] || 1;
  $("#midpointBox").innerHTML = "";

  for(let i=1;i<=days;i++){
    box.insertAdjacentHTML("beforeend",`
      <div class="card">
        <h2>第 ${i} 日行程</h2>
        <div class="grid">
          <div>
            <label>第 ${i} 日上車地點</label>
            <input class="google-place day-pickup" name="day${i}_pickup">
          </div>
          <div>
            <label>第 ${i} 日下車地點</label>
            <input class="google-place day-dropoff" name="day${i}_dropoff">
          </div>
        </div>
        <div id="day${i}_midpoints"></div>
        <br>
        <button class="btn" type="button" onclick="addDayMidpoint(${i})">＋新增第 ${i} 日中途點</button>
      </div>
    `);
  }
  initPlaces();
}

function addDayMidpoint(day){
  const box = document.getElementById(`day${day}_midpoints`);
  box.insertAdjacentHTML("beforeend",`
    <div class="grid midpoint-row">
      <div>
        <label>第 ${day} 日中途點</label>
        <input class="google-place" name="day${day}_midpoints[]">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" type="button" onclick="this.closest('.midpoint-row').remove();calc();">刪除</button>
      </div>
    </div>
  `);
  initPlaces();
}

function updateDetails(){
  const service = $("#service").value;
  const detail = $("#serviceDetail");
  detail.innerHTML = '<option value="">請選擇</option>';
  (serviceMap[service] || []).forEach(item=>{
    detail.innerHTML += `<option>${item}</option>`;
  });
  renderDays();
  calc();
}

function vehicleFilter(){
  const people = Number($("#people").value || 0);
  const bags = Number($("#bags").value || 0);
  const pet = Number(document.querySelector('[name="pet"]')?.value || 0);
  const car = $("#carType");

  const all = ["舒適五人座","豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  let allow = all;

  if(pet > 0){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else if(people <= 3 && bags <= 3){
    allow = all;
  }else if(people <= 6 && bags <= 6){
    allow = ["豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  }else if(people <= 8 && bags <= 8){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else{
    allow = ["明星保母車","依客服派車"];
  }

  car.innerHTML = allow.map(v=>`<option>${v}</option>`).join("");
}

function detectSheet(){
  const service = $("#service").value;
  const detail = $("#serviceDetail").value;
  const text = `${$("#pickup").value} ${$("#dropoff").value} ${detail}`;

  if(service === "機場接送"){
    return airportSheets.find(x=>text.includes(x) || (x==="清泉岡機場" && text.includes("清泉崗"))) || "";
  }
  if(service === "港口接送"){
    return portSheets.find(x=>text.includes(x)) || "";
  }
  if(service === "旅遊包車") return "旅遊包車";
  if(service === "登山包車") return "百岳報價";
  return detail;
}

async function getBaseFare(){
  if(!API) return 0;

  const service = $("#service").value;
  const pickup = $("#pickup").value;
  const dropoff = $("#dropoff").value;
  const vehicle = $("#carType").value;
  const sheet = detectSheet();

  if(!service || !pickup || !dropoff) return 0;
  if((service === "機場接送" || service === "港口接送") && !sheet) return 0;

  try{
    const params = new URLSearchParams({
      action:"estimate",
      service,
      serviceDetail:sheet,
      sheet,
      pickup,
      dropoff,
      vehicle
    });

    const res = await fetch(`${API}?${params.toString()}`);
    const data = await res.json();

    if(data.ok && Number(data.price)){
      return Number(data.price);
    }
  }catch(e){
    console.warn(e);
  }

  return 0;
}

let timer = null;

function calc(){
  vehicleFilter();

  clearTimeout(timer);
  timer = setTimeout(async()=>{
    const base = await getBaseFare();

    let addons = 0;
    $$(".addon").forEach(sel=>{
      addons += Number(sel.value || 0) * Number(sel.dataset.price || 0);
    });

    let total = base + addons;

    if($("#taxCheck").checked) total = Math.round(total * 1.1);
    if($("#cardCheck").checked) total = Math.round(total * 1.06);

    $("#price").textContent = money(total);
  },250);
}

function initPlaces(){
  if(!window.google || !google.maps || !google.maps.places) return;

  $$(".google-place").forEach(input=>{
    if(input.dataset.placeReady) return;

    const ac = new google.maps.places.Autocomplete(input,{
      componentRestrictions:{country:"tw"},
      fields:["formatted_address","name","geometry"]
    });

    ac.addListener("place_changed",()=>{
      const place = ac.getPlace();
      input.value = place.formatted_address || place.name || input.value;
      calc();
    });

    input.dataset.placeReady = "1";
  });
}

window.xxInitBookingPlaces = initPlaces;

function loadMaps(){
  const key = CONFIG.GOOGLE_MAPS_API_KEY || "";
  if(!key) return;

  const script = document.createElement("script");
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&callback=xxInitBookingPlaces`;
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

function collectPayload(){
  const form = document.getElementById("bookingForm");
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());

  data.action = "createOrder";
  data.service = $("#service").value;
  data.serviceDetail = $("#serviceDetail").value;
  data.pickup = $("#pickup").value;
  data.dropoff = $("#dropoff").value;
  data.people = $("#people").value;
  data.bags = $("#bags").value;
  data.vehicle = $("#carType").value;
  data.estimatedTotal = $("#price").textContent;

  data["服務項目"] = data.service;
  data["服務細項"] = data.serviceDetail;
  data["乘客姓名"] = data.guestName || "";
  data["貴賓姓名"] = data.guestName || "";
  data["聯絡電話"] = data.phone || "";
  data["手機"] = data.phone || "";
  data["預約日期"] = data.bookingDate || "";
  data["搭車時間"] = data.bookingTime || "";
  data["上車地址"] = data.pickup;
  data["下車地址"] = data.dropoff;
  data["人數"] = data.people;
  data["行李數"] = data.bags;
  data["航班編號"] = data.flightNo || "";
  data["船班編號 / 船班梯次"] = data.shipNo || "";
  data["車款"] = data.vehicle;
  data["試算表報價"] = data.estimatedTotal;
  data["備註"] = data.note || "";
  data.status = "待客服確認";

  return data;
}

async function submitForm(e){
  e.preventDefault();

  if(!API){
    alert("API 尚未設定");
    return;
  }

  const btn = document.querySelector(".btn.primary");
  btn.disabled = true;
  btn.textContent = "送出中...";

  try{
    const res = await fetch(`${API}?action=createOrder`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(collectPayload())
    });

    const data = await res.json();

    if(data.ok !== false){
      sessionStorage.setItem("xx_last_booking",JSON.stringify(data));
      location.href = "booking-success.html";
    }else{
      alert(data.message || "送出失敗");
    }
  }catch(err){
    console.error(err);
    alert("送出失敗，請改用 LINE 客服");
  }finally{
    btn.disabled = false;
    btn.textContent = "立即送出預約";
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  fillQty();
  updateDetails();
  renderDays();
  vehicleFilter();
  loadMaps();

  $("#service").addEventListener("change",updateDetails);
  $("#serviceDetail").addEventListener("change",()=>{renderDays();calc();});
  $("#people").addEventListener("input",calc);
  $("#bags").addEventListener("input",calc);
  $("#carType").addEventListener("change",calc);
  $("#pickup").addEventListener("input",calc);
  $("#dropoff").addEventListener("input",calc);
  $("#taxCheck").addEventListener("change",()=>{
    $("#taxFields").classList.toggle("hidden",!$("#taxCheck").checked);
    calc();
  });
  $("#cardCheck").addEventListener("change",calc);
  $$(".addon").forEach(x=>x.addEventListener("change",calc));
  $("#bookingForm").addEventListener("submit",submitForm);
});
</script>



<script src="assets/js/config.js"></script>
<script src="assets/js/site-layout.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/site-layout.js"></script>
</body>

  box.innerHTML = "";

  const dayMap = {"一日遊":1,"一日縱走":1,"兩天一夜":2,"三天兩夜":3,"四天三夜":4,"五天四夜":5};

  if(service !== "旅遊包車" && service !== "登山包車"){
    $("#midpointBox").innerHTML = `
      <br>
      <button class="btn" type="button" onclick="addMidpoint()">＋新增中途點</button>
    `;
    return;
  }

  const days = dayMap[detail] || 1;
  $("#midpointBox").innerHTML = "";

  for(let i=1;i<=days;i++){
    box.insertAdjacentHTML("beforeend",`
      <div class="card">
        <h2>第 ${i} 日行程</h2>
        <div class="grid">
          <div>
            <label>第 ${i} 日上車地點</label>
            <input class="google-place day-pickup" name="day${i}_pickup">
          </div>
          <div>
            <label>第 ${i} 日下車地點</label>
            <input class="google-place day-dropoff" name="day${i}_dropoff">
          </div>
        </div>
        <div id="day${i}_midpoints"></div>
        <br>
        <button class="btn" type="button" onclick="addDayMidpoint(${i})">＋新增第 ${i} 日中途點</button>
      </div>
    `);
  }
  initPlaces();
}

function addDayMidpoint(day){
  const box = document.getElementById(`day${day}_midpoints`);
  box.insertAdjacentHTML("beforeend",`
    <div class="grid midpoint-row">
      <div>
        <label>第 ${day} 日中途點</label>
        <input class="google-place" name="day${day}_midpoints[]">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" type="button" onclick="this.closest('.midpoint-row').remove();calc();">刪除</button>
      </div>
    </div>
  `);
  initPlaces();
}

function updateDetails(){
  const service = $("#service").value;
  const detail = $("#serviceDetail");
  detail.innerHTML = '<option value="">請選擇</option>';
  (serviceMap[service] || []).forEach(item=>{
    detail.innerHTML += `<option>${item}</option>`;
  });
  renderDays();
  calc();
}

function vehicleFilter(){
  const people = Number($("#people").value || 0);
  const bags = Number($("#bags").value || 0);
  const pet = Number(document.querySelector('[name="pet"]')?.value || 0);
  const car = $("#carType");

  const all = ["舒適五人座","豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  let allow = all;

  if(pet > 0){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else if(people <= 3 && bags <= 3){
    allow = all;
  }else if(people <= 6 && bags <= 6){
    allow = ["豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  }else if(people <= 8 && bags <= 8){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else{
    allow = ["明星保母車","依客服派車"];
  }

  car.innerHTML = allow.map(v=>`<option>${v}</option>`).join("");
}

function detectSheet(){
  const service = $("#service").value;
  const detail = $("#serviceDetail").value;
  const text = `${$("#pickup").value} ${$("#dropoff").value} ${detail}`;

  if(service === "機場接送"){
    return airportSheets.find(x=>text.includes(x) || (x==="清泉岡機場" && text.includes("清泉崗"))) || "";
  }
  if(service === "港口接送"){
    return portSheets.find(x=>text.includes(x)) || "";
  }
  if(service === "旅遊包車") return "旅遊包車";
  if(service === "登山包車") return "百岳報價";
  return detail;
}

async function getBaseFare(){
  if(!API) return 0;

  const service = $("#service").value;
  const pickup = $("#pickup").value;
  const dropoff = $("#dropoff").value;
  const vehicle = $("#carType").value;
  const sheet = detectSheet();

  if(!service || !pickup || !dropoff) return 0;
  if((service === "機場接送" || service === "港口接送") && !sheet) return 0;

  try{
    const params = new URLSearchParams({
      action:"estimate",
      service,
      serviceDetail:sheet,
      sheet,
      pickup,
      dropoff,
      vehicle
    });

    const res = await fetch(`${API}?${params.toString()}`);
    const data = await res.json();

    if(data.ok && Number(data.price)){
      return Number(data.price);
    }
  }catch(e){
    console.warn(e);
  }

  return 0;
}

let timer = null;

function calc(){
  vehicleFilter();

  clearTimeout(timer);
  timer = setTimeout(async()=>{
    const base = await getBaseFare();

    let addons = 0;
    $$(".addon").forEach(sel=>{
      addons += Number(sel.value || 0) * Number(sel.dataset.price || 0);
    });

    let total = base + addons;

    if($("#taxCheck").checked) total = Math.round(total * 1.1);
    if($("#cardCheck").checked) total = Math.round(total * 1.06);

    $("#price").textContent = money(total);
  },250);
}

function initPlaces(){
  if(!window.google || !google.maps || !google.maps.places) return;

  $$(".google-place").forEach(input=>{
    if(input.dataset.placeReady) return;

    const ac = new google.maps.places.Autocomplete(input,{
      componentRestrictions:{country:"tw"},
      fields:["formatted_address","name","geometry"]
    });

    ac.addListener("place_changed",()=>{
      const place = ac.getPlace();
      input.value = place.formatted_address || place.name || input.value;
      calc();
    });

    input.dataset.placeReady = "1";
  });
}

window.xxInitBookingPlaces = initPlaces;

function loadMaps(){
  const key = CONFIG.GOOGLE_MAPS_API_KEY || "";
  if(!key) return;

  const script = document.createElement("script");
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&callback=xxInitBookingPlaces`;
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

function collectPayload(){
  const form = document.getElementById("bookingForm");
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());

  data.action = "createOrder";
  data.service = $("#service").value;
  data.serviceDetail = $("#serviceDetail").value;
  data.pickup = $("#pickup").value;
  data.dropoff = $("#dropoff").value;
  data.people = $("#people").value;
  data.bags = $("#bags").value;
  data.vehicle = $("#carType").value;
  data.estimatedTotal = $("#price").textContent;

  data["服務項目"] = data.service;
  data["服務細項"] = data.serviceDetail;
  data["乘客姓名"] = data.guestName || "";
  data["貴賓姓名"] = data.guestName || "";
  data["聯絡電話"] = data.phone || "";
  data["手機"] = data.phone || "";
  data["預約日期"] = data.bookingDate || "";
  data["搭車時間"] = data.bookingTime || "";
  data["上車地址"] = data.pickup;
  data["下車地址"] = data.dropoff;
  data["人數"] = data.people;
  data["行李數"] = data.bags;
  data["航班編號"] = data.flightNo || "";
  data["船班編號 / 船班梯次"] = data.shipNo || "";
  data["車款"] = data.vehicle;
  data["試算表報價"] = data.estimatedTotal;
  data["備註"] = data.note || "";
  data.status = "待客服確認";

  return data;
}

async function submitForm(e){
  e.preventDefault();

  if(!API){
    alert("API 尚未設定");
    return;
  }

  const btn = document.querySelector(".btn.primary");
  btn.disabled = true;
  btn.textContent = "送出中...";

  try{
    const res = await fetch(`${API}?action=createOrder`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(collectPayload())
    });

    const data = await res.json();

    if(data.ok !== false){
      sessionStorage.setItem("xx_last_booking",JSON.stringify(data));
      location.href = "booking-success.html";
    }else{
      alert(data.message || "送出失敗");
    }
  }catch(err){
    console.error(err);
    alert("送出失敗，請改用 LINE 客服");
  }finally{
    btn.disabled = false;
    btn.textContent = "立即送出預約";
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  fillQty();
  updateDetails();
  renderDays();
  vehicleFilter();
  loadMaps();

  $("#service").addEventListener("change",updateDetails);
  $("#serviceDetail").addEventListener("change",()=>{renderDays();calc();});
  $("#people").addEventListener("input",calc);
  $("#bags").addEventListener("input",calc);
  $("#carType").addEventListener("change",calc);
  $("#pickup").addEventListener("input",calc);
  $("#dropoff").addEventListener("input",calc);
  $("#taxCheck").addEventListener("change",()=>{
    $("#taxFields").classList.toggle("hidden",!$("#taxCheck").checked);
    calc();
  });
  $("#cardCheck").addEventListener("change",calc);
  $$(".addon").forEach(x=>x.addEventListener("change",calc));
  $("#bookingForm").addEventListener("submit",submitForm);
});
</script>

<script>
const CONFIG = window.XUANXIANG_CONFIG || {};
const API = CONFIG.APPS_SCRIPT_URL || CONFIG.BOOKING_API || "";

const serviceMap = {
  "機場接送":["送機","接機","接送"],
  "港口接送":["送港","接船","接送"],
  "旅遊包車":["一日遊","兩天一夜","三天兩夜","四天三夜","五天四夜"],
  "登山包車":["去程","回程","一日縱走","兩天一夜","三天兩夜"],
  "演唱會接送":["去程","回程","來回","包車"]
};

const airportSheets = ["桃園機場","松山機場","清泉岡機場","小港機場"];
const portSheets = ["平安港","台北郵輪港","台中港","高雄香蕉碼頭","基隆港","東港碼頭","布袋港碼頭","富岡漁港","後壁湖碼頭"];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const money = n => n ? "NT$" + Number(n).toLocaleString("zh-TW") : "$0";

function fillQty(){
  $$(".addon").forEach(sel=>{
    sel.innerHTML = Array.from({length:10},(_,i)=>`<option value="${i}">${i}</option>`).join("");
  });
}

function addMidpoint(value=""){
  const box = $("#midpointBox");
  box.insertAdjacentHTML("beforeend",`
    <div class="grid midpoint-row">
      <div>
        <label>中途點</label>
        <input class="google-place midpoint" name="midpoints[]" value="${value}" placeholder="可輸入景點、飯店、地址">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" type="button" onclick="this.closest('.midpoint-row').remove();calc();">刪除中途點</button>
      </div>
    </div>
  `);
  initPlaces();
}

function renderDays(){
  const service = $("#service").value;
  const detail = $("#serviceDetail").value;
  const box = $("#routeDays");
  box.innerHTML = "";

  const dayMap = {"一日遊":1,"一日縱走":1,"兩天一夜":2,"三天兩夜":3,"四天三夜":4,"五天四夜":5};

  if(service !== "旅遊包車" && service !== "登山包車"){
    $("#midpointBox").innerHTML = `
      <br>
      <button class="btn" type="button" onclick="addMidpoint()">＋新增中途點</button>
    `;
    return;
  }

  const days = dayMap[detail] || 1;
  $("#midpointBox").innerHTML = "";

  for(let i=1;i<=days;i++){
    box.insertAdjacentHTML("beforeend",`
      <div class="card">
        <h2>第 ${i} 日行程</h2>
        <div class="grid">
          <div>
            <label>第 ${i} 日上車地點</label>
            <input class="google-place day-pickup" name="day${i}_pickup">
          </div>
          <div>
            <label>第 ${i} 日下車地點</label>
            <input class="google-place day-dropoff" name="day${i}_dropoff">
          </div>
        </div>
        <div id="day${i}_midpoints"></div>
        <br>
        <button class="btn" type="button" onclick="addDayMidpoint(${i})">＋新增第 ${i} 日中途點</button>
      </div>
    `);
  }
  initPlaces();
}

function addDayMidpoint(day){
  const box = document.getElementById(`day${day}_midpoints`);
  box.insertAdjacentHTML("beforeend",`
    <div class="grid midpoint-row">
      <div>
        <label>第 ${day} 日中途點</label>
        <input class="google-place" name="day${day}_midpoints[]">
      </div>
      <div style="display:flex;align-items:end">
        <button class="btn" type="button" onclick="this.closest('.midpoint-row').remove();calc();">刪除</button>
      </div>
    </div>
  `);
  initPlaces();
}

function updateDetails(){
  const service = $("#service").value;
  const detail = $("#serviceDetail");
  detail.innerHTML = '<option value="">請選擇</option>';
  (serviceMap[service] || []).forEach(item=>{
    detail.innerHTML += `<option>${item}</option>`;
  });
  renderDays();
  calc();
}

function vehicleFilter(){
  const people = Number($("#people").value || 0);
  const bags = Number($("#bags").value || 0);
  const pet = Number(document.querySelector('[name="pet"]')?.value || 0);
  const car = $("#carType");

  const all = ["舒適五人座","豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  let allow = all;

  if(pet > 0){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else if(people <= 3 && bags <= 3){
    allow = all;
  }else if(people <= 6 && bags <= 6){
    allow = ["豪華九人座","VITO","阿法","Lexus LM","明星保母車","依客服派車"];
  }else if(people <= 8 && bags <= 8){
    allow = ["豪華九人座","VITO","明星保母車","依客服派車"];
  }else{
    allow = ["明星保母車","依客服派車"];
  }

  car.innerHTML = allow.map(v=>`<option>${v}</option>`).join("");
}

function detectSheet(){
  const service = $("#service").value;
  const detail = $("#serviceDetail").value;
  const text = `${$("#pickup").value} ${$("#dropoff").value} ${detail}`;

  if(service === "機場接送"){
    return airportSheets.find(x=>text.includes(x) || (x==="清泉岡機場" && text.includes("清泉崗"))) || "";
  }
  if(service === "港口接送"){
    return portSheets.find(x=>text.includes(x)) || "";
  }
  if(service === "旅遊包車") return "旅遊包車";
  if(service === "登山包車") return "百岳報價";
  return detail;
}

async function getBaseFare(){
  if(!API) return 0;

  const service = $("#service").value;
  const pickup = $("#pickup").value;
  const dropoff = $("#dropoff").value;
  const vehicle = $("#carType").value;
  const sheet = detectSheet();

  if(!service || !pickup || !dropoff) return 0;
  if((service === "機場接送" || service === "港口接送") && !sheet) return 0;

  try{
    const params = new URLSearchParams({
      action:"estimate",
      service,
      serviceDetail:sheet,
      sheet,
      pickup,
      dropoff,
      vehicle
    });

    const res = await fetch(`${API}?${params.toString()}`);
    const data = await res.json();

    if(data.ok && Number(data.price)){
      return Number(data.price);
    }
  }catch(e){
    console.warn(e);
  }

  return 0;
}

let timer = null;

function calc(){
  vehicleFilter();

  clearTimeout(timer);
  timer = setTimeout(async()=>{
    const base = await getBaseFare();

    let addons = 0;
    $$(".addon").forEach(sel=>{
      addons += Number(sel.value || 0) * Number(sel.dataset.price || 0);
    });

    let total = base + addons;

    if($("#taxCheck").checked) total = Math.round(total * 1.1);
    if($("#cardCheck").checked) total = Math.round(total * 1.06);

    $("#price").textContent = money(total);
  },250);
}

function initPlaces(){
  if(!window.google || !google.maps || !google.maps.places) return;

  $$(".google-place").forEach(input=>{
    if(input.dataset.placeReady) return;

    const ac = new google.maps.places.Autocomplete(input,{
      componentRestrictions:{country:"tw"},
      fields:["formatted_address","name","geometry"]
    });

    ac.addListener("place_changed",()=>{
      const place = ac.getPlace();
      input.value = place.formatted_address || place.name || input.value;
      calc();
    });

    input.dataset.placeReady = "1";
  });
}

window.xxInitBookingPlaces = initPlaces;

function loadMaps(){
  const key = CONFIG.GOOGLE_MAPS_API_KEY || "";
  if(!key) return;

  const script = document.createElement("script");
  script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&callback=xxInitBookingPlaces`;
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

function collectPayload(){
  const form = document.getElementById("bookingForm");
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());

  data.action = "createOrder";
  data.service = $("#service").value;
  data.serviceDetail = $("#serviceDetail").value;
  data.pickup = $("#pickup").value;
  data.dropoff = $("#dropoff").value;
  data.people = $("#people").value;
  data.bags = $("#bags").value;
  data.vehicle = $("#carType").value;
  data.estimatedTotal = $("#price").textContent;

  data["服務項目"] = data.service;
  data["服務細項"] = data.serviceDetail;
  data["乘客姓名"] = data.guestName || "";
  data["貴賓姓名"] = data.guestName || "";
  data["聯絡電話"] = data.phone || "";
  data["手機"] = data.phone || "";
  data["預約日期"] = data.bookingDate || "";
  data["搭車時間"] = data.bookingTime || "";
  data["上車地址"] = data.pickup;
  data["下車地址"] = data.dropoff;
  data["人數"] = data.people;
  data["行李數"] = data.bags;
  data["航班編號"] = data.flightNo || "";
  data["船班編號 / 船班梯次"] = data.shipNo || "";
  data["車款"] = data.vehicle;
  data["試算表報價"] = data.estimatedTotal;
  data["備註"] = data.note || "";
  data.status = "待客服確認";

  return data;
}

async function submitForm(e){
  e.preventDefault();

  if(!API){
    alert("API 尚未設定");
    return;
  }

  const btn = document.querySelector(".btn.primary");
  btn.disabled = true;
  btn.textContent = "送出中...";

  try{
    const res = await fetch(`${API}?action=createOrder`,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(collectPayload())
    });

    const data = await res.json();

    if(data.ok !== false){
      sessionStorage.setItem("xx_last_booking",JSON.stringify(data));
      location.href = "booking-success.html";
    }else{
      alert(data.message || "送出失敗");
    }
  }catch(err){
    console.error(err);
    alert("送出失敗，請改用 LINE 客服");
  }finally{
    btn.disabled = false;
    btn.textContent = "立即送出預約";
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  fillQty();
  updateDetails();
  renderDays();
  vehicleFilter();
  loadMaps();

  $("#service").addEventListener("change",updateDetails);
  $("#serviceDetail").addEventListener("change",()=>{renderDays();calc();});
  $("#people").addEventListener("input",calc);
  $("#bags").addEventListener("input",calc);
  $("#carType").addEventListener("change",calc);
  $("#pickup").addEventListener("input",calc);
  $("#dropoff").addEventListener("input",calc);
  $("#taxCheck").addEventListener("change",()=>{
    $("#taxFields").classList.toggle("hidden",!$("#taxCheck").checked);
    calc();
  });
  $("#cardCheck").addEventListener("change",calc);
  $$(".addon").forEach(x=>x.addEventListener("change",calc));
  $("#bookingForm").addEventListener("submit",submitForm);
});
